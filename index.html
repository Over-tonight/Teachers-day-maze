<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Day Maze</title>

    <style>
        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        #info {
            font-size: 20px;
            margin: 15px;
        }

        #maze {
            display: grid;
            margin: 20px auto;
            width: 600px;
            height: 600px;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 5px solid white;
        }

        .wall {
            background: #374151;
        }

        .path {
            background: #f3f4f6;
        }

        .player {
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .exit {
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        #message {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>🎓 THE TEACHER'S MAZE</h1>

    <div id="info">
        Use the arrow keys or WASD to escape!
    </div>

    <div id="maze"></div>

    <div id="message"></div>

    <script>

        const maze = [
            "###############",
            "#P            #",
            "############# #",
            "#             #",
            "# #############",
            "#             #",
            "############# #",
            "#             #",
            "# #############",
            "#             #",
            "############# #",
            "#             #",
            "# #############",
            "#            E#",
            "###############"
        ];

        const mazeElement = document.getElementById("maze");

        let playerRow = 1;
        let playerCol = 1;

        function drawMaze() {

            mazeElement.innerHTML = "";

            for (let row = 0; row < maze.length; row++) {

                for (let col = 0; col < maze[row].length; col++) {

                    const cell = document.createElement("div");

                    if (maze[row][col] === "#") {
                        cell.classList.add("wall");
                    } 
                    else {
                        cell.classList.add("path");
                    }

                    if (row === playerRow && col === playerCol) {
                        cell.classList.add("player");
                        cell.innerHTML = "🧑‍🏫";
                    }

                    if (maze[row][col] === "E") {
                        cell.classList.add("exit");
                        cell.innerHTML = "🚪";
                    }

                    mazeElement.appendChild(cell);
                }
            }
        }

        function movePlayer(rowChange, colChange) {

            const newRow = playerRow + rowChange;
            const newCol = playerCol + colChange;

            if (
                newRow < 0 ||
                newRow >= maze.length ||
                newCol < 0 ||
                newCol >= maze[newRow].length
            ) {
                return;
            }

            if (maze[newRow][newCol] === "#") {
                return;
            }

            playerRow = newRow;
            playerCol = newCol;

            drawMaze();

            if (maze[playerRow][playerCol] === "E") {

                document.getElementById("message").innerHTML =
                    "🎉 MAZE COMPLETE! Your next clue awaits!";

            }
        }

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
                movePlayer(-1, 0);
            }

            if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
                movePlayer(1, 0);
            }

            if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
                movePlayer(0, -1);
            }

            if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
                movePlayer(0, 1);
            }

        });

        drawMaze();

    </script>

</body>
</html>
